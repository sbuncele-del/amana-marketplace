name: Plentovo
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Plentovo:
    type: application
    platform: iOS
    sources:
      - PlentovoApp.swift
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plentovo.shop
        INFOPLIST_KEY_CFBundleDisplayName: Plentovo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
schemes:
  Plentovo:
    build:
      targets:
        Plentovo: all
