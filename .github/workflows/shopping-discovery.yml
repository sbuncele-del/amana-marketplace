name: Shopping discovery checks
on:
  pull_request:
    paths:
      - 'src/lib/shopping-mission*.ts'
      - 'src/components/shop/shopping-missions.tsx'
      - 'src/app/(main)/collections/**'
      - 'src/app/(main)/page.tsx'
      - 'scripts/test-shopping-missions.ts'
      - '.github/workflows/shopping-discovery.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: node --import tsx scripts/test-shopping-missions.ts
      - run: npx eslint src/lib/shopping-missions.ts src/lib/shopping-mission-products.ts src/components/shop/shopping-missions.tsx 'src/app/(main)/collections/[slug]/page.tsx' 'src/app/(main)/page.tsx'
