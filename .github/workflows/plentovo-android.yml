name: Plentovo Android test build

on:
  push:
    paths:
      - 'apps/android/**'
      - 'public/icons/plentovo-512.png'
      - '.github/workflows/plentovo-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: plentovo-huawei-device-test
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
