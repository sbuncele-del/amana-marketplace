workflows:
  plentovo-ios-simulator:
    name: Plentovo iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.0
    scripts:
      - &prepare_ios
        name: Generate Plentovo Xcode project and app icon
        script: |
          set -eu
          command -v xcodegen >/dev/null || brew install xcodegen
          cd "$CM_BUILD_DIR/apps/ios"
          mkdir -p Assets.xcassets/AppIcon.appiconset
          printf '%s\n' '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          printf '%s\n' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json
          sips -z 1024 1024 "$CM_BUILD_DIR/public/icons/plentovo-512.png" --out "$TMPDIR/plentovo-icon.png"
          swift make-icon.swift "$TMPDIR/plentovo-icon.png" Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Compile for iPhone Simulator
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/ios"
          xcodebuild -project Plentovo.xcodeproj -scheme Plentovo -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/Plentovo.app Plentovo-Simulator.zip
    artifacts:
      - apps/ios/Plentovo-Simulator.zip

  plentovo-ios-release:
    name: Plentovo iOS signed App Store IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.plentovo.shop
    scripts:
      - *prepare_ios
      - name: Sign and export App Store IPA
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/ios"
          xcrun agvtool new-version -all "$BUILD_NUMBER"
          xcode-project use-profiles
          xcode-project build-ipa --project Plentovo.xcodeproj --scheme Plentovo
    artifacts:
      - apps/ios/build/ios/ipa/*.ipa
